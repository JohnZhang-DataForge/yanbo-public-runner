name: AoC Recompiler Windows Prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'aoc-recompiler/**'
      - '.github/workflows/aoc-recompiler-windows.yml'
  pull_request:
    paths:
      - 'aoc-recompiler/**'
      - '.github/workflows/aoc-recompiler-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test generated native code
        working-directory: aoc-recompiler
        run: python -m unittest discover -s tests -v
      - name: Package translator as Windows executable
        working-directory: aoc-recompiler
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --onefile --name aoc-recompile recompile.py
      - name: Test packaged executable
        working-directory: aoc-recompiler
        run: python tests/smoke_package.py dist/aoc-recompile.exe
      - uses: actions/upload-artifact@v4
        with:
          name: aoc-recompiler-windows-prototype
          path: aoc-recompiler/dist/aoc-recompile.exe
          if-no-files-found: error
